# SonarCloud Configuration
# Documentation: https://docs.sonarsource.com/sonarcloud/advanced-setup/ci-based-analysis/sonarscanner-cli/

# Project identification
sonar.projectKey=baphled_KaRiya
sonar.organization=baphled

# Project metadata
sonar.projectName=KaRiya

# Source configuration  
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Test configuration - files matching test.inclusions are treated as tests (excluded from most rules including CPD)
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/features/**,**/internal/testutil/**,**/mocks/**

# Go coverage report (generated by CI)
sonar.go.coverage.reportPaths=coverage.out

# Exclusions - files/directories to skip from analysis entirely
# Note: test files are handled via sonar.test.inclusions, not exclusions
sonar.exclusions=vendor/**,testdata/**,*.pb.go,node_modules/**,demos/**

# Duplication exclusions (CPD = Copy-Paste Detection) - backup for any test files not caught
sonar.cpd.exclusions=**/*_test.go,**/features/**,**/internal/testutil/**,**/mocks/**

# Quality gate settings (configured in SonarCloud UI)
# sonar.qualitygate.wait=true
