# SonarCloud Configuration
# Documentation: https://docs.sonarsource.com/sonarcloud/advanced-setup/ci-based-analysis/sonarscanner-cli/

# Project identification
sonar.projectKey=baphled_KaRiya
sonar.organization=baphled

# Project metadata
sonar.projectName=KaRiya

# Source configuration  
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Test configuration - files matching test.inclusions are treated as tests
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/features/**,**/internal/testutil/**,**/mocks/**

# Go coverage report (generated by CI)
sonar.go.coverage.reportPaths=coverage.out

# Exclusions - files/directories to skip from source analysis (double-exclusion pattern for test files)
sonar.exclusions=vendor/**,testdata/**,*.pb.go,node_modules/**,demos/**,**/*_test.go,**/features/**,**/internal/testutil/**,**/mocks/**,scripts/**

# Duplication exclusions (CPD = Copy-Paste Detection)
sonar.cpd.exclusions=**/*_test.go,**/features/**,**/internal/testutil/**,**/mocks/**,**/statematrix/generator.go,**/service/career/cv/export_service.go,scripts/**

# Quality gate settings (configured in SonarCloud UI)
# sonar.qualitygate.wait=true
