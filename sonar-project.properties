# SonarCloud Configuration
# Documentation: https://docs.sonarsource.com/sonarcloud/advanced-setup/ci-based-analysis/sonarscanner-cli/

# Project identification
sonar.projectKey=baphled_KaRiya
sonar.organization=baphled

# Project metadata
sonar.projectName=KaRiya

# Source configuration
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Test configuration
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go coverage report (generated by CI)
sonar.go.coverage.reportPaths=coverage.out

# Exclusions - files/directories to skip
sonar.exclusions=**/vendor/**,**/testdata/**,**/*_test.go,**/mocks/**,**/*.pb.go,**/node_modules/**,**/demos/**

# Duplication exclusions (CPD = Copy-Paste Detection)
# BDD step definitions often have similar boilerplate patterns
sonar.cpd.exclusions=**/*_test.go,**/features/steps/**,**/testutil/**,**/mocks/**

# Quality gate settings (configured in SonarCloud UI)
# sonar.qualitygate.wait=true
