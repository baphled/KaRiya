name: Architecture Lint

on:
  pull_request:
    paths:
      - 'internal/tui/intents/**'
      - 'internal/tui/views/**'
      - 'internal/tui/components/**'
      - 'internal/ui/behaviors/**'
      - 'internal/ui/uikit/**'
      - 'internal/tui/forms/**'
      - 'internal/**/*_test.go'
      - 'internal/testutil/**'
      - 'tools/analyzers/noinlinecareer/**'
  push:
    branches:
      - next
      - main
    paths:
      - 'internal/tui/intents/**'
      - 'internal/tui/views/**'
      - 'internal/**/*_test.go'
      - 'internal/testutil/**'

env:
  GO_VERSION: '1.26'

jobs:
  intent-architecture:
    name: Intent Architecture Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Get changed files
        if: github.event_name == 'pull_request'
        id: changed-files
        run: |
          # Get list of changed files in this PR (intent and view files only)
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | \
            grep -E '^internal/tui/(intents|views)/' | \
            grep '\.go$' | \
            grep -v '_test\.go$' || true)
          
          echo "Changed intent/screen files:"
          echo "$CHANGED"
          
          # Store as output (space-separated for passing to script)
          echo "files=$(echo $CHANGED | tr '\n' ' ')" >> $GITHUB_OUTPUT
          
          # Check if any relevant files changed
          if [ -n "$CHANGED" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Check Intent Architecture (PR - changed files only)
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.has_changes == 'true'
        # Note: Some checks (#24-28) are global and will find pre-existing violations.
        # These will be fixed in migration PRs. For now, we show violations but don't block.
        continue-on-error: true
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Running architecture check on changed files:"
          echo "${{ steps.changed-files.outputs.files }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Note: Global checks (#24-28) may show pre-existing violations."
          echo "These will be fixed in separate migration PRs."
          echo ""
          bash scripts/check-intent-architecture.sh ${{ steps.changed-files.outputs.files }}

      - name: Skip Intent Architecture (PR - no relevant changes)
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.has_changes == 'false'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "No intent/screen files changed in this PR."
          echo "Skipping architecture check."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Check Intent Architecture (Push - enforced)
        if: github.event_name == 'push'
        run: make check-intent-architecture

  golangci-lint:
    name: Comprehensive Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint (PR - full scan)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          install-mode: binary
          args: --timeout=5m
          # Note: We run full scan (not --new-from-rev) to catch pre-existing issues
          # that would block merging to next. This ensures PRs don't merge code that
          # will fail when pushed to next.

      - name: Run golangci-lint (Push - full scan)
        if: github.event_name == 'push'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          install-mode: binary
          args: --timeout=5m

  docblocks:
    name: Structured Doc Comments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run docblocks analyzer
        run: make check-docblocks

  fixture-usage:
    name: Fixture Usage Enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run fixture usage analyzer
        run: make check-fixtures

  pattern-compliance:
    name: Pattern Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check Patterns
        run: make check-patterns

  test:
    name: Test (Push to next/main)
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Install Ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo@latest

      - name: Run tests
        run: ginkgo -v --race --cover --coverprofile="coverage.out" --skip-package=testdata,noinlinecareer/testdata,features ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  report:
    name: Architecture Report
    runs-on: ubuntu-latest
    needs: [intent-architecture, golangci-lint, docblocks, fixture-usage, pattern-compliance, test]
    if: always()
    steps:
      - name: Architecture Validation Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏛️  ARCHITECTURE VALIDATION SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Intent Architecture: ${{ needs.intent-architecture.result }}"
          echo "Golangci-lint:       ${{ needs.golangci-lint.result }}"
          echo "Docblocks:           ${{ needs.docblocks.result }}"
          echo "Fixture Usage:       ${{ needs.fixture-usage.result }}"
          echo "Pattern Compliance:  ${{ needs.pattern-compliance.result }}"
          echo "Tests:               ${{ needs.test.result }}"
          echo ""
          
          # For PRs, intent-architecture uses continue-on-error, so it may show
          # as "success" even with violations. We only enforce golangci-lint and
          # pattern compliance for PRs. Intent architecture is informational
          # until legacy intents are migrated.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ needs.golangci-lint.result }}" != "success" ] || \
               [ "${{ needs.fixture-usage.result }}" != "success" ] || \
               [ "${{ needs.pattern-compliance.result }}" != "success" ]; then
              echo "❌ Architecture validation FAILED"
              echo ""
              echo "See: docs/checklists/INTENT_DEVELOPMENT_CHECKLIST.md"
              exit 1
            else
              if [ "${{ needs.intent-architecture.result }}" != "success" ]; then
                echo "⚠️  Intent architecture has violations (informational - not blocking)"
                echo "   Legacy intents need migration. See violations in job output."
              fi
              echo "✅ Required architecture checks passed"
            fi
          else
            # For pushes, all checks must pass (including tests)
            if [ "${{ needs.intent-architecture.result }}" != "success" ] || \
               [ "${{ needs.golangci-lint.result }}" != "success" ] || \
               [ "${{ needs.fixture-usage.result }}" != "success" ] || \
               [ "${{ needs.pattern-compliance.result }}" != "success" ] || \
               [ "${{ needs.test.result }}" != "success" ]; then
              echo "❌ Validation FAILED"
              echo ""
              echo "See: docs/checklists/INTENT_DEVELOPMENT_CHECKLIST.md"
              exit 1
            else
              echo "✅ All checks passed (linting + tests)"
            fi
          fi
