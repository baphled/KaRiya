name: CI

on:
  # Only run on PRs to avoid duplicate test runs
  # Push to next/main is covered by architecture-lint.yml
  pull_request:
    branches:
      - next
      - main

env:
  GO_VERSION: '1.25'

jobs:
  # Lint commit messages
  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    # Skip for next -> main PRs (release PRs validate full history)
    if: ${{ github.event_name == 'pull_request' && !(github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'next') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate PR commits with commitlint
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # Lint and format checks
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go fmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files need formatting:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

  # Golangci-lint (comprehensive static analysis including doc checks)
  golangci-lint:
    name: Golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
          install-mode: binary
          args: --timeout=5m
          # Note: We run full scan (not only-new-issues) to catch pre-existing issues
          # that would block merging to next. This ensures consistent quality checks.

  # Docblocks enforcement (structured doc comments on exports)
  docblocks:
    name: Docblocks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run docblocks analyzer
        run: |
          go build -o ./bin/docblocks ./cmd/docblocks
          go vet -vettool=./bin/docblocks \
            ./internal/cli/app/... \
            ./internal/cli/behaviors/... \
            ./internal/cli/bootstrap/... \
            ./internal/cli/configtypes/... \
            ./internal/cli/forms/... \
            ./internal/cli/importer/... \
            ./internal/cli/intents/... \
            ./internal/cli/navigation/... \
            ./internal/cli/screens/... \
            ./internal/cli/service/... \
            ./internal/cli/statematrix/... \
            ./internal/cli/terminal/... \
            ./internal/cli/themes/... \
            ./internal/cli/types/... \
            ./internal/cli/uikit/... \
            ./tools/analyzers/docblocks/...

  # Intent architecture enforcement
  architecture:
    name: Intent Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run architecture checks
        run: bash scripts/check-intent-architecture.sh

  # Run tests
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Install Ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo@latest

      - name: Run tests
        run: ginkgo -v --race --cover --coverprofile=coverage.out --skip-package=testdata,noinlinecareer/testdata,features ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Build binaries
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, golangci-lint, docblocks, architecture]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build for Linux
        run: |
          GOOS=linux GOARCH=amd64 go build -o kariya-linux-amd64 ./cmd/cli
          chmod +x kariya-linux-amd64

      - name: Build for macOS (AMD64)
        run: |
          GOOS=darwin GOARCH=amd64 go build -o kariya-darwin-amd64 ./cmd/cli
          chmod +x kariya-darwin-amd64

      - name: Build for macOS (ARM64)
        run: |
          GOOS=darwin GOARCH=arm64 go build -o kariya-darwin-arm64 ./cmd/cli
          chmod +x kariya-darwin-arm64

      - name: Build for Windows
        run: GOOS=windows GOARCH=amd64 go build -o kariya-windows-amd64.exe ./cmd/cli

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            kariya-linux-amd64
            kariya-darwin-amd64
            kariya-darwin-arm64
            kariya-windows-amd64.exe
          retention-days: 7

  # Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'

      - name: Fix SARIF relationships format
        if: always()
        run: |
          if [ -f gosec.sarif ]; then
            bash scripts/fix-sarif-output.sh gosec.sarif
          fi

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif

