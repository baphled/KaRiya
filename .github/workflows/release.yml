name: Release

on:
  push:
    branches:
      - main

env:
  GO_VERSION: '1.24'

jobs:
  # Run CI checks before release
  ci:
    name: Run CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Install Ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo@latest

      - name: Run tests
        run: ginkgo -v --race --cover ./...

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files need formatting:"
            gofmt -l .
            exit 1
          fi

  # Build release binaries
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build for Linux (AMD64)
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.Version=$(git describe --tags --always)" -o kariya-linux-amd64 ./cmd/cli
          chmod +x kariya-linux-amd64

      - name: Build for macOS (AMD64)
        run: |
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.Version=$(git describe --tags --always)" -o kariya-darwin-amd64 ./cmd/cli
          chmod +x kariya-darwin-amd64

      - name: Build for macOS (ARM64)
        run: |
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.Version=$(git describe --tags --always)" -o kariya-darwin-arm64 ./cmd/cli
          chmod +x kariya-darwin-arm64

      - name: Build for Windows (AMD64)
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.Version=$(git describe --tags --always)" -o kariya-windows-amd64.exe ./cmd/cli

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: |
            kariya-linux-amd64
            kariya-darwin-amd64
            kariya-darwin-arm64
            kariya-windows-amd64.exe
          retention-days: 1

  # Semantic release
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: .

      - name: Make binaries executable
        run: |
          chmod +x kariya-linux-amd64
          chmod +x kariya-darwin-amd64
          chmod +x kariya-darwin-arm64

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@martynus.net
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@martynus.net
        run: npx semantic-release

  # Notify on failure
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [ci, build, release]
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v8
        with:
          script: |
            const title = `Release workflow failed - ${context.sha.substring(0, 7)}`;
            const body = `## Release Workflow Failed

            **Commit:** ${context.sha}
            **Branch:** ${context.ref}
            **Workflow:** ${context.workflow}
            **Run:** ${context.runNumber}

            [View workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})

            Please investigate and fix the issue.`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['release-failure', 'ci/cd']
            });

