name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, deleted]

jobs:
  # Validate PR targets correct branch
  validate-target-branch:
    name: Validate Target Branch
    runs-on: ubuntu-latest
    steps:
      - name: Check target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "PR: $HEAD_REF → $BASE_REF"
          
          # Allow next → main (release PRs)
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" == "next" ]]; then
            echo "✅ Release PR: next → main is allowed"
            exit 0
          fi
          
          # Block all other PRs targeting main
          if [[ "$BASE_REF" == "main" ]]; then
            echo "❌ ERROR: PRs must target 'next' branch, not 'main'"
            echo ""
            echo "Only 'next → main' PRs are allowed for releases."
            echo "Please change your PR target to 'next'."
            echo ""
            echo "See docs/BRANCHING_STRATEGY.md for details."
            exit 1
          fi
          
          echo "✅ Target branch '$BASE_REF' is valid"

  # Validate PR title follows conventional commits
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    # Only run on pull_request events
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint
        run: npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | npx commitlint --config .commitlintrc.json

  # Check for AI attribution in commits
  check-ai-attribution:
    name: Check AI Attribution
    runs-on: ubuntu-latest
    # Only run on pull_request events
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commits for AI attribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Checking commits for AI attribution..."

          # Get commits between base and head
          COMMITS=$(git log --format=%H "${BASE_SHA}..${HEAD_SHA}")

          echo "Commits to check:"
          echo "$COMMITS"
          echo ""

          # Check each commit
          AI_COMMITS=0
          ATTRIBUTED_COMMITS=0
          MISSING_ATTRIBUTION=()

          for commit in $COMMITS; do
            COMMIT_MSG=$(git log --format=%B -n 1 $commit)
            COMMIT_SHORT=$(git log --format=%h -n 1 $commit)
            COMMIT_SUBJECT=$(git log --format=%s -n 1 $commit)

            # Check if commit has code files
            CODE_FILES=$(git show --name-only --format= $commit | grep -E '\.(go|js|ts|py|java|c|cpp|rs)$' || true)

            if [ -n "$CODE_FILES" ]; then
              AI_COMMITS=$((AI_COMMITS + 1))

              # Check for AI attribution
              if echo "$COMMIT_MSG" | grep -q "AI-Generated-By:"; then
                ATTRIBUTED_COMMITS=$((ATTRIBUTED_COMMITS + 1))
                echo "✅ $COMMIT_SHORT: Has AI attribution"
              else
                echo "⚠️  $COMMIT_SHORT: Missing AI attribution (if AI-generated)"
                MISSING_ATTRIBUTION+=("$COMMIT_SHORT: $COMMIT_SUBJECT")
              fi
            fi
          done

          echo ""
          echo "Summary:"
          echo "  Total commits with code: $AI_COMMITS"
          echo "  Commits with AI attribution: $ATTRIBUTED_COMMITS"
          echo ""

          if [ ${#MISSING_ATTRIBUTION[@]} -gt 0 ]; then
            echo "⚠️  Commits without AI attribution:"
            printf '%s\n' "${MISSING_ATTRIBUTION[@]}"
            echo ""
            echo "If any of these commits contain AI-generated code, they should include:"
            echo "  AI-Generated-By: <Assistant> (<Model>)"
            echo "  Reviewed-By: <Your Name>"
            echo ""
            echo "See docs/rules/AI_COMMIT_ATTRIBUTION.md for details."
          else
            echo "✅ All code commits have AI attribution (if applicable)"
          fi

  # Validate conventional commits
  conventional-commits:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    # Only run on pull_request events, skip for next -> main PRs (release PRs may have legacy commits)
    if: github.event_name == 'pull_request' && !(github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'next')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate all commits in PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # Check for breaking changes
  breaking-changes:
    name: Check Breaking Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Only run on pull_request events
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for breaking changes
        id: breaking
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Check commit messages for BREAKING CHANGE
          if git log "${BASE_SHA}..${HEAD_SHA}" --format=%B | grep -qi "BREAKING CHANGE"; then
            echo "has_breaking=true" >> $GITHUB_OUTPUT
            echo "⚠️  This PR contains BREAKING CHANGES"
          else
            echo "has_breaking=false" >> $GITHUB_OUTPUT
            echo "✅ No breaking changes detected"
          fi

      - name: Comment on PR if breaking changes detected
        if: steps.breaking.outputs.has_breaking == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **BREAKING CHANGES DETECTED**\n\nThis PR contains breaking changes. Please ensure:\n- [ ] Breaking changes are clearly documented\n- [ ] Migration guide is provided (if needed)\n- [ ] Version will be bumped to next major version\n- [ ] Team has been notified'
            });

  # Size label
  size-label:
    name: PR Size Label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Only run on pull_request events, not on review/comment events
    if: github.event_name == 'pull_request'
    steps:
      - name: Add size label
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/xs'
          xs_max_size: 10
          s_label: 'size/s'
          s_max_size: 100
          m_label: 'size/m'
          m_max_size: 500
          l_label: 'size/l'
          l_max_size: 1000
          xl_label: 'size/xl'
          fail_if_xl: false

  # Block merge if there are unresolved review comments/suggestions
  check-unresolved-comments:
    name: Check Unresolved Review Comments
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check for unresolved review threads
        uses: actions/github-script@v8
        with:
          script: |
            // Get PR number from different event types
            let prNumber;
            if (context.payload.pull_request) {
              prNumber = context.payload.pull_request.number;
            } else if (context.payload.review) {
              prNumber = context.payload.review.pull_request_url.split('/').pop();
            } else if (context.payload.comment) {
              prNumber = context.payload.comment.pull_request_url.split('/').pop();
            }

            console.log(`Checking PR #${prNumber} for unresolved review threads...`);

            // Use GraphQL to get review threads with resolution status
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100) {
                      nodes {
                        isResolved
                        isOutdated
                        comments(first: 1) {
                          nodes {
                            body
                            path
                            author {
                              login
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: parseInt(prNumber)
            });

            const threads = result.repository.pullRequest.reviewThreads.nodes;

            // Filter for unresolved, non-outdated threads, excluding bot comments
            const unresolvedThreads = threads.filter(t => {
              if (t.isResolved || t.isOutdated) return false;
              const comment = t.comments.nodes[0];
              if (!comment) return false;
               // Exclude bot-authored comments (e.g., Copilot, dependabot)
               const login = comment.author?.login || '';
               const isBot = comment.author?.type === 'Bot' || 
                            login.includes('[bot]') || 
                            login.startsWith('copilot-') ||
                            login === 'dependabot[bot]';
               return !isBot;
            });

            console.log(`\nTotal review threads: ${threads.length}`);
            console.log(`Unresolved threads: ${unresolvedThreads.length}`);

            if (unresolvedThreads.length > 0) {
              console.log('\n❌ UNRESOLVED REVIEW COMMENTS FOUND:\n');

              unresolvedThreads.forEach((thread, index) => {
                const comment = thread.comments.nodes[0];
                if (comment) {
                  console.log(`${index + 1}. ${comment.path}`);
                  console.log(`   Author: @${comment.author?.login || 'unknown'}`);
                  console.log(`   Comment: ${comment.body.substring(0, 150)}${comment.body.length > 150 ? '...' : ''}`);
                  console.log('');
                }
              });

              console.log('\n📋 TO RESOLVE THESE COMMENTS:');
              console.log('   1. Address each suggestion by implementing the change, OR');
              console.log('   2. Reply explaining why the suggestion is not applicable, OR');
              console.log('   3. Click "Resolve conversation" after addressing/discussing');
              console.log('\n⚠️  PRs cannot be merged with unresolved review comments.');

              core.setFailed(`Found ${unresolvedThreads.length} unresolved review comment(s). Please address all review feedback before merging.`);
            } else {
              console.log('\n✅ All review threads are resolved or outdated.');
            }

