severity:
  default-severity: warning
  case-sensitive: false
  rules:
    # Errors (blocking)
    - linters:
        - errcheck
        - nilerr
        - gosec
        - depguard
      severity: error

    # Warnings (non-blocking initially)
    - linters:
        - stylecheck
        - godot
        - revive
      severity: warning
