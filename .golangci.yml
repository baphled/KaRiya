# =============================================================================
# KaRiya golangci-lint Configuration
# =============================================================================
#
# This configuration enforces:
#   1. Go Idioms & Best Practices (Effective Go, Go Code Review Comments)
#   2. Project Architecture (layer dependencies, component usage)
#   3. Documentation Standards (docs/conventions/GO_DOCUMENTATION_RULES.md)
#
# Structure:
#   - SECTION A: Go Idioms & Best Practices
#   - SECTION B: Project Architecture Rules
#   - SECTION C: Legacy Exemptions (minimal, clearly marked)
#
# =============================================================================

version: "2"

run:
  tests: true
  allow-parallel-runners: true

output:
  formats:
    text:
      path: stdout
      colors: true
      print-linter-name: true
      print-issued-lines: true

# =============================================================================
# LINTER ENABLEMENT
# =============================================================================
linters:
  enable:
    # ---------------------------------------------------------------------------
    # Go Default Linters (always enabled)
    # ---------------------------------------------------------------------------
    - errcheck          # Unchecked errors (Go idiom: always handle errors)
    - govet             # Suspicious constructs
    - ineffassign       # Ineffectual assignments
    - staticcheck       # Comprehensive static analysis (includes gosimple, stylecheck)
    - unused            # Unused code

    # ---------------------------------------------------------------------------
    # Go Idioms & Style
    # ---------------------------------------------------------------------------
    - revive            # Go style enforcement (replaces golint)
    - misspell          # Spelling mistakes
    - whitespace        # Unnecessary whitespace
    - godot             # Comments end with period
    - nakedret          # Naked returns in long functions
    - dupword           # Duplicate words in comments
    - copyloopvar       # Unnecessary loop variable copies (Go 1.22+)
    - intrange          # Use integer ranges in for loops (Go 1.22+)
    - perfsprint        # Replace fmt.Sprintf with faster alternatives
    - recvcheck         # Receiver type consistency (all pointer or all value)

    # ---------------------------------------------------------------------------
    # Error Handling (MANDATORY)
    # ---------------------------------------------------------------------------
    - nilerr            # nil return when err != nil
    - errorlint         # Error wrapping issues
    - nilnil            # (nil, nil) returns
    - errname           # Sentinel errors prefixed Err, error types suffixed Error
    - errchkjson        # JSON encoding type safety

    # ---------------------------------------------------------------------------
    # Code Quality & Complexity
    # ---------------------------------------------------------------------------
    - gocyclo           # Cyclomatic complexity
    - gocognit          # Cognitive complexity
    - funlen            # Function length
    - lll               # Line length
    - nestif            # Nested if statements
    - gocritic          # Comprehensive linting
    - unconvert         # Unnecessary conversions
    - unparam           # Unused parameters
    - dupl              # Code duplication
    - wastedassign      # Dead variable assignments
    - dogsled           # Too many blank identifiers
    - predeclared       # Shadowing Go predeclared identifiers
    - forcetypeassert   # Unchecked type assertions (panic risk)
    - usestdlibvars     # Use stdlib constants instead of literals

    # ---------------------------------------------------------------------------
    # Security
    # ---------------------------------------------------------------------------
    - gosec             # Security issues

    # ---------------------------------------------------------------------------
    # Architecture & Imports
    # ---------------------------------------------------------------------------
    - depguard          # Import restrictions
    - gomoddirectives   # go.mod directives
    - importas          # Import aliases
    - interfacebloat    # Interface size
    - reassign          # Package variable reassignment
    - gocheckcompilerdirectives  # Valid //go: directives

    # ---------------------------------------------------------------------------
    # Testing
    # ---------------------------------------------------------------------------
    - tparallel         # t.Parallel() usage
    - testifylint       # testify usage
    - ginkgolinter      # Ginkgo/Gomega best practices
    - thelper           # Test helpers must call t.Helper()
    - usetesting        # Use testing package replacements

    # ---------------------------------------------------------------------------
    # Comment Hygiene
    # ---------------------------------------------------------------------------
    - godox             # TODO, FIXME, HACK markers
    - forbidigo         # Forbidden function calls
    - nolintlint        # Stale/unused //nolint directives

    # ---------------------------------------------------------------------------
    # Context
    # ---------------------------------------------------------------------------
    - contextcheck      # context.Context usage
    - fatcontext        # Nested contexts in loops

  settings:
    # ---------------------------------------------------------------------------
    # A1. Error Handling (Go idiom: never ignore errors)
    # ---------------------------------------------------------------------------
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - io.Copy
        - io.WriteString
        - (*bytes.Buffer).WriteString
        - (*strings.Builder).WriteString

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    # ---------------------------------------------------------------------------
    # A2. Naming Conventions (Go idiom: short, clear names)
    # ---------------------------------------------------------------------------
    revive:
      severity: warning
      confidence: 0.8
      rules:
        # Naming (Go idioms)
        - name: var-naming
          severity: warning
        - name: package-comments
          severity: warning
        - name: exported
          severity: warning

        # Error handling
        - name: error-return
          severity: error
        - name: error-strings
          severity: warning
        - name: error-naming
          severity: warning

        # Code quality
        - name: blank-imports
          severity: warning
        - name: context-as-argument
          severity: error
        - name: context-keys-type
          severity: warning
        - name: dot-imports
          severity: warning
        - name: empty-block
          severity: warning
        - name: early-return
          severity: warning
        - name: unexported-return
          severity: warning
        - name: unused-parameter
          severity: warning
        - name: unnecessary-stmt
          severity: warning
        - name: unreachable-code
          severity: error
        - name: redefines-builtin-id
          severity: error

        # Function design
        - name: function-result-limit
          severity: warning
          arguments: [3]
        - name: argument-limit
          severity: warning
          arguments: [5]

        # Complexity
        - name: cognitive-complexity
          severity: warning
          arguments: [20]
        - name: cyclomatic
          severity: warning
          arguments: [15]

        # Imports
        - name: import-shadowing
          severity: warning

    # ---------------------------------------------------------------------------
    # A3. Code Complexity (Go idiom: simple, readable code)
    # ---------------------------------------------------------------------------
    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 20

    funlen:
      lines: 60
      statements: 40
      ignore-comments: true

    nestif:
      min-complexity: 4

    lll:
      line-length: 140
      tab-width: 4

    # ---------------------------------------------------------------------------
    # A4. Code Duplication (DRY principle)
    # ---------------------------------------------------------------------------
    dupl:
      threshold: 100

    # ---------------------------------------------------------------------------
    # A5. Interface Design (Go idiom: small interfaces)
    # ---------------------------------------------------------------------------
    interfacebloat:
      max: 5

    # ---------------------------------------------------------------------------
    # A6. Import Aliases (consistency)
    # ---------------------------------------------------------------------------
    importas:
      no-unaliased: false
      alias:
        - pkg: github.com/charmbracelet/bubbletea
          alias: tea

    # ---------------------------------------------------------------------------
    # A7. Code Analysis
    # ---------------------------------------------------------------------------
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
      disabled-checks:
        - whyNoLint
        - hugeParam
        - ifElseChain
        - singleCaseSwitch
        - unnamedResult
        - paramTypeCombine
        - octalLiteral
        - appendCombine
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 128

    # ---------------------------------------------------------------------------
    # A8. Comment Hygiene (Forbidden Markers Only)
    # ---------------------------------------------------------------------------
    godox:
      keywords:
        - TODO
        - FIXME
        - HACK
        - XXX
        - NOTE
        - BUG

    # ---------------------------------------------------------------------------
    # A9. Security
    # ---------------------------------------------------------------------------
    gosec:
      excludes:
        - G104
      config:
        global:
          audit: enabled

    # ---------------------------------------------------------------------------
    # A10. Test Quality
    # ---------------------------------------------------------------------------
    testifylint:
      enable-all: true

    ginkgolinter:
      suppress-len-assertion: false
      suppress-nil-assertion: false
      suppress-err-assertion: false
      suppress-compare-assertion: false
      suppress-async-assertion: false
      suppress-type-compare-assertion: false

    # ---------------------------------------------------------------------------
    # A11. Nolint Directive Hygiene
    # ---------------------------------------------------------------------------
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    # ---------------------------------------------------------------------------
    # B1. Forbidden Patterns
    # ---------------------------------------------------------------------------
    forbidigo:
      forbid:
        - pattern: '\.kariya'
          msg: |
            HARDCODED PATH: Avoid hardcoding .kariya paths.
            For production: Use config.GetConfigPath()
            For tests: Use t.TempDir()
      analyze-types: false

    # ---------------------------------------------------------------------------
    # B2. Import Restrictions (Architecture enforcement)
    # ---------------------------------------------------------------------------
    depguard:
      rules:
        # Layer 1: UIKit (foundation - no TUI imports)
        uikit-no-tui-imports:
          files:
            - "**/uikit/**/*.go"
          deny:
            - pkg: "github.com/baphled/kariya/internal/cli/intents"
              desc: "ARCHITECTURE: uikit/ cannot import intents/"
            - pkg: "github.com/baphled/kariya/internal/cli/screens"
              desc: "ARCHITECTURE: uikit/ cannot import screens/"
            - pkg: "github.com/baphled/kariya/internal/cli/components"
              desc: "ARCHITECTURE: uikit/ cannot import components/"
            - pkg: "github.com/baphled/kariya/internal/cli/behaviors"
              desc: "ARCHITECTURE: uikit/ cannot import behaviors/"
            - pkg: "github.com/baphled/kariya/internal/cli/models"
              desc: "ARCHITECTURE: uikit/ cannot import models/"
            - pkg: "github.com/baphled/kariya/internal/cli/forms"
              desc: "ARCHITECTURE: uikit/ cannot import forms/"

        # Layer 2: Behaviors (utilities - no screen/intent imports)
        behaviors-no-tui-imports:
          files:
            - "**/behaviors/**/*.go"
          deny:
            - pkg: "github.com/baphled/kariya/internal/cli/intents"
              desc: "ARCHITECTURE: behaviors/ cannot import intents/"
            - pkg: "github.com/baphled/kariya/internal/cli/screens"
              desc: "ARCHITECTURE: behaviors/ cannot import screens/"

        # Layer 3: Screens (views - cannot import intents)
        screens-no-intent-imports:
          files:
            - "**/screens/**/*.go"
            - "**/screens/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/baphled/kariya/internal/cli/intents"
              desc: "ARCHITECTURE: screens/ cannot import intents/"

        # Deprecated: components/ package
        prevent-deprecated-components:
          files:
            - "!**/components/**"
            - "!**/*_test.go"
            - "**/intents/**/*.go"
            - "**/screens/**/*.go"
          deny:
            - pkg: "github.com/baphled/kariya/internal/cli/components"
              desc: "DEPRECATED: Use uikit/ packages instead"

        # Deprecated: styles/ package
        prevent-deprecated-styles:
          files:
            - "!**/styles/**"
            - "!**/uikit/**"
            - "!**/components/**"
            - "!**/models/**"
            - "!**/*_test.go"
            - "**/intents/**/*.go"
            - "**/screens/**/*.go"
          deny:
            - pkg: "github.com/baphled/kariya/internal/cli/styles"
              desc: "DEPRECATED: Use theme system instead"

        # Forms: huh restricted to forms/ package
        huh-restricted-to-forms:
          files:
            - "**/intents/**/*.go"
            - "**/intents/*.go"
            - "**/screens/**/*.go"
            - "**/screens/*.go"
            - "**/components/**/*.go"
            - "**/components/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/charmbracelet/huh"
              desc: "ARCHITECTURE: huh can only be imported in forms/ package"

        # Tables: use TableBehavior
        tables-use-behavior:
          files:
            - "**/intents/**/*.go"
            - "**/screens/**/*.go"
          deny:
            - pkg: "github.com/charmbracelet/bubbles/table"
              desc: "PATTERN: Use behaviors.TableBehavior[T] instead"

        # Main rule - allows all project internal packages and third-party deps
        main:
          files:
            - $all
          list-mode: strict
          allow:
            - $gostd
            - github.com/baphled/kariya
            - github.com/charmbracelet
            - github.com/google/uuid
            - github.com/mattn/go-sqlite3
            - modernc.org/sqlite
            - github.com/onsi/ginkgo/v2
            - github.com/onsi/gomega
            - github.com/spf13/cobra
            - github.com/spf13/viper
            - github.com/rmhubbert/bubbletea-overlay
            - golang.org/x/text
            - golang.org/x/tools
            - gopkg.in/yaml.v3
            - github.com/pressly/goose/v3
            - github.com/atotto/clipboard
            - github.com/bluele/factory-go/factory
            - github.com/brianvoe/gofakeit/v7
            - gorm.io/gorm
            - gorm.io/driver/sqlite

  # =========================================================================
  # SECTION C: EXCLUSIONS & LEGACY EXEMPTIONS
  # =========================================================================
  # Complete exclusions migrated from v1 issues.exclude-rules.
  # Exemptions are minimal and clearly marked. New code MUST follow all rules.
  # =========================================================================
  exclusions:
    # -------------------------------------------------------------------------
    # EXC PATTERNS - Re-add v1 default exclusions (except EXC0002, EXC0012-EXC0015)
    # These suppress common false positives across the codebase.
    # -------------------------------------------------------------------------
    rules:
      # EXC0001: errcheck - common close/flush/print errors
      - linters:
          - errcheck
        text: 'Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print(f|ln)?|os\.(Un)?Setenv). is not checked'

      # EXC0003: golint - test package stuttering
      - linters:
          - revive
        text: 'func name will be used as test\.Test.* by other packages, and that stutters; consider calling this'

      # EXC0004: govet - unsafe.Pointer false positives
      - linters:
          - govet
        text: '(possible misuse of unsafe.Pointer|should have signature)'

      # EXC0005: staticcheck - explicit break in switch
      - linters:
          - staticcheck
        text: 'SA4011'

      # EXC0006: gosec - unsafe calls
      - linters:
          - gosec
        text: 'G103: Use of unsafe calls should be audited'

      # EXC0007: gosec - parameterized shell calls
      - linters:
          - gosec
        text: 'G204: Subprocess launched with variable'

      # EXC0008: gosec - duplicated errcheck
      - linters:
          - gosec
        text: 'G104'

      # EXC0009: gosec - directory/file permissions
      - linters:
          - gosec
        text: '(G301|G302|G307): Expect (directory permissions to be 0750|file permissions to be 0600) or less'

      # EXC0010: gosec - file inclusion via variable
      - linters:
          - gosec
        text: 'G304: Potential file inclusion via variable'

      # EXC0011: stylecheck - exported comment checks (handled by revive)
      - linters:
          - stylecheck
        text: '(ST1000|ST1020|ST1021|ST1022)'

    # -------------------------------------------------------------------------
    # C1: TEST FILES - Relaxed requirements (standard practice)
    # -------------------------------------------------------------------------
      - path: '(.+)_test\.go'
        linters:
          - funlen
          - dupl
          - gocyclo
          - gocognit
          - godox
          - errcheck
          - lll
          - forcetypeassert
          - perfsprint
          - wastedassign
          - nolintlint
          - thelper
          - recvcheck

      - path: '(.+)_test\.go'
        linters:
          - revive
          - staticcheck
        text: "dot-imports|unused-parameter|argument-limit|ST1000|ST1020|ST1021|ST1022"

      - path: '(.+)_test\.go'
        linters:
          - depguard

    # -------------------------------------------------------------------------
    # C2: BUBBLE TEA PATTERNS - Framework idioms (not legacy)
    # -------------------------------------------------------------------------
      - path: '(.*)\.go'
        linters:
          - gocyclo
        source: "func.*Update.*tea\\.Msg"

      - path: '(.*)\.go'
        linters:
          - funlen
        source: "func.*View\\(\\).*string"

      - path: '(.*)\.go'
        linters:
          - revive
        text: "empty-interface"
        source: "tea\\.Msg"

      - linters:
          - contextcheck
        text: "non-inherited new context"

      # Modal type assertions
      - path: 'internal/cli/screens/.*/modals/(.*)\.go'
        linters:
          - errcheck
        text: "Error return value is not checked"

      # Modal duplication (standard pattern)
      - path: 'internal/cli/screens/.*/modals/(.*)\.go'
        linters:
          - dupl
          - funlen

      - path: 'internal/cli/screens/.*/modals/(.*)\.go'
        linters:
          - gocritic
        text: "singleCaseSwitch"

      # Modal revive patterns
      - path: 'internal/cli/screens/.*/modals/(.*)\.go'
        linters:
          - revive
        text: "unnecessary-stmt"

      - path: 'internal/cli/screens/.*/modals/(.*)\.go'
        linters:
          - revive
        text: "unused-parameter"

      - path: 'internal/cli/screens/.*/modals/(.*)\.go'
        linters:
          - godot

    # -------------------------------------------------------------------------
    # C3: GENERATED FILES - Skip all
    # -------------------------------------------------------------------------
      - path: '(.*)_generated\.go'
        linters:
          - all

    # -------------------------------------------------------------------------
    # C4: CONFIGURATION - Legitimate exceptions
    # -------------------------------------------------------------------------
      - path: 'internal/config/config\.go'
        linters:
          - forbidigo
        text: "HARDCODED PATH"

      - path: 'internal/config/config\.go'
        linters:
          - funlen

    # -------------------------------------------------------------------------
    # C5: TEST UTILITIES - Factory patterns
    # -------------------------------------------------------------------------
      - path: 'internal/testutil/(.*)\.go'
        linters:
          - errcheck
          - revive
          - funlen
          - gocritic

    # -------------------------------------------------------------------------
    # C6: DEPRECATED PACKAGES (migration tracked)
    # DEPRECATED: internal/cli/components/ -> migrate to uikit/
    # DEPRECATED: internal/cli/models/ -> migrate to screens/
    # -------------------------------------------------------------------------
      - path: 'internal/cli/components/(.*)\.go'
        linters:
          - godot
          - stylecheck
          - revive
          - gocognit
          - gocyclo
          - funlen
          - nestif
          - dupl
          - gocritic

      - path: 'internal/cli/models/(.*)\.go'
        linters:
          - godot
          - stylecheck
          - revive
          - gocognit
          - gocyclo
          - funlen
          - nestif
          - dupl
          - gocritic
          - perfsprint

      # GORM models intentionally mix pointer/value receivers
      - path: 'internal/repository/models/career\.go'
        linters:
          - recvcheck

    # -------------------------------------------------------------------------
    # C7: LEGACY SINGLE-FILE INTENTS (migration tracked)
    # -------------------------------------------------------------------------
      - path: 'internal/cli/intents/generate_cv_intent\.go'
        linters:
          - godot
          - stylecheck
          - revive
          - gocognit
          - gocyclo
          - funlen
          - nestif
          - dupl

      - path: 'internal/cli/intents/configure_system_intent\.go'
        linters:
          - godot
          - stylecheck
          - revive
          - gocognit
          - gocyclo
          - funlen
          - nestif

      - path: 'internal/cli/intents/configure_system\.go'
        linters:
          - godot
          - stylecheck
          - revive
          - gocognit
          - gocyclo
          - funlen

      - path: 'internal/cli/intents/modals\.go'
        linters:
          - godot
          - stylecheck
          - revive
          - funlen
          - dupl
          - gocritic

      - path: 'internal/cli/intents/modal_(.*)\.go'
        linters:
          - godot
          - stylecheck
          - revive

      - path: 'internal/cli/intents/view_helpers\.go'
        linters:
          - stylecheck

    # -------------------------------------------------------------------------
    # C8: huh IMPORTS (migration to forms/ tracked)
    # -------------------------------------------------------------------------
      - path: 'internal/cli/models/(.*)\.go'
        linters:
          - depguard
        text: "huh-restricted-to-forms"

      - path: 'internal/cli/components/(.*)\.go'
        linters:
          - depguard
        text: "huh-restricted-to-forms"

      - path: 'internal/cli/intents/modals\.go'
        linters:
          - depguard
        text: "huh-restricted-to-forms"

      - path: 'internal/cli/screens/base/form_screen\.go'
        linters:
          - depguard
        text: "huh-restricted-to-forms"

      - path: 'internal/cli/screens/configure/(.*)\.go'
        linters:
          - depguard
        text: "huh-restricted-to-forms"

      - path: 'internal/cli/screens/skills/skill_form\.go'
        linters:
          - depguard
        text: "huh-restricted-to-forms"

      - path: 'internal/cli/screens/timeline/modals/(.*)\.go'
        linters:
          - depguard
        text: "huh-restricted-to-forms"

    # -------------------------------------------------------------------------
    # C9: DEPRECATED COMPONENTS USAGE (migration tracked)
    # -------------------------------------------------------------------------
      - path: 'internal/cli/intents/skillsmanagement/(.*)\.go'
        linters:
          - depguard
        text: "prevent-deprecated-components"

    # -------------------------------------------------------------------------
    # C12: SUBDIRECTORY INTENTS - Migrated architecture
    # -------------------------------------------------------------------------
      - path: 'internal/cli/intents/captureevent/(.*)\.go'
        linters:
          - gocognit
          - gocyclo
          - nestif
          - funlen
          - errcheck

      - path: 'internal/cli/intents/captureevent/(.*)\.go'
        linters:
          - revive
        text: "cognitive-complexity|cyclomatic|unnecessary-stmt|unused-parameter"

      - path: 'internal/cli/intents/browsetimeline/(.*)\.go'
        linters:
          - revive
          - gocognit
          - gocyclo
          - nestif
          - funlen
          - errcheck

      - path: 'internal/cli/intents/skillsmanagement/(.*)\.go'
        linters:
          - revive
          - gocognit
          - gocyclo
          - nestif
          - funlen
          - errcheck
          - godox
          - depguard

      - path: 'internal/cli/intents/burst_management/(.*)\.go'
        linters:
          - stylecheck
          - revive
          - gocognit
          - gocyclo
          - nestif
          - funlen
          - errcheck

      - path: 'internal/cli/screens/burst_management/(.*)\.go'
        linters:
          - stylecheck

      - path: 'internal/cli/intents/factmanagement/(.*)\.go'
        linters:
          - revive
          - gocognit
          - gocyclo
          - nestif
          - funlen
          - errcheck

    # -------------------------------------------------------------------------
    # C13: LEGACY SERVICE LAYER - Needs separate refactoring
    # -------------------------------------------------------------------------
      - path: 'internal/service/career/cv/export_service\.go'
        linters:
          - gocognit
          - gocyclo
          - funlen
          - nestif
          - dupl
          - revive
          - lll
          - unparam

      - path: 'internal/service/career/service\.go'
        linters:
          - gocognit
          - gocyclo
          - funlen
          - nestif
          - dupl

      - path: 'internal/service/career/cv/section_builder\.go'
        linters:
          - gocognit
          - gocyclo
          - funlen
          - nestif
          - godox
          - revive
          - lll

      - path: 'internal/service/career/cv/bullet_generator\.go'
        linters:
          - gocognit
          - gocyclo
          - funlen
          - gocritic
          - revive
          - interfacebloat
          - godox
          - godot

      - path: 'internal/service/career/cv/yaml_config_manager\.go'
        linters:
          - gocognit
          - gocyclo
          - funlen
          - nestif
          - gocritic
          - revive

      - path: 'internal/service/career/cv/data_processing_service\.go'
        linters:
          - gocognit
          - gocyclo
          - funlen
          - nestif
          - gocritic
          - godox

      - path: 'internal/service/career/cv/cv_generation_service\.go'
        linters:
          - gocognit
          - gocyclo
          - funlen
          - nestif
          - revive
          - godox

    # -------------------------------------------------------------------------
    # C14: LEGACY CLI - Needs refactoring
    # -------------------------------------------------------------------------
      - path: 'internal/cli/models/burst_suggestion_new\.go'
        linters:
          - gocognit
          - gocyclo
          - funlen
          - nestif
          - revive

      - path: 'internal/cli/models/standard_model\.go'
        linters:
          - gocognit
          - gocyclo
          - funlen
          - nestif
          - revive

      - path: 'internal/cli/models/metadata_editor_new\.go'
        linters:
          - revive
          - dupl

      - path: 'internal/cli/models/fact_editor_new\.go'
        linters:
          - revive
          - dupl

      - path: 'internal/cli/models/capture_form\.go'
        linters:
          - gocritic

      - path: 'internal/cli/models/skill_form\.go'
        linters:
          - gocritic

      - path: 'cmd/cli/main\.go'
