# =============================================================================
# FORMATTERS (v2 - separated from linters)
# =============================================================================
formatters:
  enable:
    - gofmt             # Formatting (non-negotiable)
    - goimports         # Import organization

# =============================================================================
# SEVERITY CONFIGURATION
# =============================================================================
severity:
  default: warning
  rules:
    # Errors (blocking)
    - linters:
        - errcheck
        - nilerr
        - gosec
        - depguard
      severity: error

    # Warnings (non-blocking initially)
    - linters:
        - godot
        - revive
      severity: warning
